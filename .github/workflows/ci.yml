name: CI
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run size
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  browser:
    # needs network (Pyodide from the CDN, miniworlds from PyPI); Chromium only, Firefox is run locally before a release
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: pip install playwright && playwright install --with-deps chromium
      - run: npm run build
      # every test runs even if an earlier one fails, so that one failure does not hide the next
      - name: Browser tests against the preview server
        run: |
          npx vite preview --port 4173 &
          sleep 3
          failed=""
          for t in blocks smoke run miniworlds templates assist; do python test/$t.py chromium || failed="$failed $t"; done
          test -z "$failed" || { echo "FAILED:$failed"; exit 1; }
      - name: Browser tests with their own servers
        if: success() || failure()
        run: |
          failed=""
          for t in pwa embed selfhost responsive a11y history world input launch sound rename csp git collab help; do python test/$t.py chromium || failed="$failed $t"; done
          test -z "$failed" || { echo "FAILED:$failed"; exit 1; }
      - name: Memory
        if: success() || failure()
        run: python test/memory.py && LOW_MEMORY=1 python test/memory.py
