name: Classroom backend integration
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  classroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: asbl/miniworlds
          path: classroom-backend
          sparse-checkout: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r classroom-backend/backend/requirements.txt playwright
      - run: playwright install --with-deps chromium
      - run: npm run build
      - run: python test/backend.py
        env:
          BACKEND_ROOT: ${{ github.workspace }}/classroom-backend/backend
