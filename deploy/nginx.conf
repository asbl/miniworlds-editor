# Static hosting of the miniworlds editor (see docs/deploy.md).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm application/manifest+json image/svg+xml;

    # Only these pages may embed the editor (keep in step with embedOrigins in config.json).
    # add_header is not inherited into a location that has its own add_header, so each location repeats the set.
    set $frame "frame-ancestors 'self' https://www.opencoding.de";

    # default: always revalidate (index.html, sw.js, config.json, manifest, icons): updates are found at once
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $frame always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # file names contain a content hash
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $frame always;
        add_header X-Content-Type-Options nosniff always;
    }

    # the default type table lacks .mjs (Pyodide is loaded as an ES module) and .webmanifest
    location ~ \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $frame always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # self-hosted Pyodide: the version is part of the path
    location /pyodide/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $frame always;
        add_header X-Content-Type-Options nosniff always;
    }
}
