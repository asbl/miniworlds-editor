# Static hosting of the miniworlds editor (see docs/deploy.md).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm application/manifest+json image/svg+xml;

    # Content Security Policy (test/csp.py runs the editor under exactly this line).
    #  - scripts and workers only from this origin; 'unsafe-eval' is needed by Pyodide: loading pygame-ce (a WebAssembly side module) builds functions from strings, and 'wasm-unsafe-eval' alone is refused;
    #  - the network only for PyPI (version list, packages): nothing else can be fetched by code that runs in the editor;
    #  - styles may be inline (CodeMirror sets style attributes);
    #  - frame-ancestors: only these pages may embed the editor (keep in step with embedOrigins in config.json).
    # add_header is not inherited into a location that has its own add_header, so each location repeats the set.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://pypi.org https://files.pythonhosted.org https://backend.editor.opencoding.de; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://www.opencoding.de https://backend.editor.opencoding.de";

    # default: always revalidate (index.html, sw.js, config.json, manifest, icons): updates are found at once
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # file names contain a content hash
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
    }

    # the default type table lacks .mjs (Pyodide is loaded as an ES module) and .webmanifest
    location ~ \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # "work together": the WebSocket relay (docker-compose.yml, service `collab`); see docs/collab.md. The name is resolved when a
    # request comes in, so that the editor still starts and works when the relay is not running.
    location /collab/ {
        resolver 127.0.0.11 valid=10s;
        set $collab http://collab:8787;
        proxy_pass $collab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        client_max_body_size 1k;
        add_header Cache-Control "no-store" always;
    }

    # self-hosted Pyodide: the version is part of the path
    location /pyodide/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
    }
}
