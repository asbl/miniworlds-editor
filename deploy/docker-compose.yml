# Server side of the editor: a static nginx container behind the shared Traefik (same pattern as the other sites).
# Host-specific image/runtime settings belong in the ignored docker-compose.override.yml.
# Put this file, nginx.conf and html/ (the contents of dist/) into one folder, then: docker compose up -d
services:
  editor:
    image: "nginx:stable-alpine"
    container_name: editor
    restart: unless-stopped
    networks:
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.editor.loadbalancer.server.port=80"
      - "traefik.http.routers.editor.rule=Host(`editor.opencoding.de`)"
      - "traefik.http.routers.editor.entrypoints=websecure"
      - "traefik.http.routers.editor.service=editor"
      - "traefik.http.routers.editor.tls.certresolver=alpnresolver"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Relay for "work together" (optional; without it the editor simply hides the feature). Not reachable from outside:
  # nginx passes /collab/ on to it. The origin list keeps other sites (and forks) from using it.
  collab:
    build: ./collab
    container_name: editor-collab
    restart: unless-stopped
    networks:
      - traefik_default
    environment:
      COLLAB_ORIGINS: "https://editor.opencoding.de"
      COLLAB_TRUST_PROXY: "2" # Traefik and nginx in front of the relay
    mem_limit: 512m

networks:
  traefik_default:
    external: true
